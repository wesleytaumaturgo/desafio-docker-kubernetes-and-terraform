{{- /*
Job regular (sem hook): convive com helm --wait. O nome carrega o hash do ConfigMap
das migrations — só muda (e recria o Job) quando as migrations mudam. Sem TTL (I1=a1).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ include (print $.Template.BasePath "/migrations-configmap.yaml") . | sha256sum | trunc 8 }}
  labels:
    {{- include "mural.labels" (dict "ctx" $ "component" "migrate") | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "mural.labels" (dict "ctx" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-db
          image: {{ .Values.migrate.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -U \"$POSTGRES_USER\"; do sleep 2; done"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mural-db
                  key: POSTGRES_USER
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      containers:
        - name: migrate
          image: {{ .Values.migrate.image }}
          command:
            - sh
            - -c
            - 'for f in $(ls /migrations/*.sql | sort); do echo "applying $f"; psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$f"; done'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mural-db
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: mural-migrations
