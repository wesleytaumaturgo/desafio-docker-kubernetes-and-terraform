{{- $password := required "db.password é obrigatório (vem do Terraform)" .Values.db.password }}
apiVersion: v1
kind: Secret
metadata:
  name: mural-db
  labels:
    {{- include "mural.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "mural.databaseUrl" . | quote }}
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.db.name | quote }}
