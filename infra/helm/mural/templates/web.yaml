apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "mural.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "mural.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mural.labels" (dict "ctx" $ "component" "web") | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: mural-config
                  key: API_UPSTREAM
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "mural.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mural.selectorLabels" (dict "ctx" $ "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.port }}
